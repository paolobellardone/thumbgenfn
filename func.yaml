schema_version: 20180708
name: thumbgenfn
version: 1.0.0
runtime: java
build_image: container-registry.oracle.com/oci_functions/fn-java-fdk-build:jdk21-1.1.22
run_image: container-registry.oracle.com/oci_functions/fn-java-fdk:jre21-1.1.22
cmd: io.fnproject.demo.ThumbnailGeneratorFunction::handleRequest
memory: 256
timeout: 120
config:
  BUCKET_IN: imageIn
  BUCKET_OUT: imageOut
  DEBUG: "true"
  IMAGE_FORMAT: jpg
  NAME_PREFIX: scaled-
  SCALING_FACTOR: "0.5"
